global:
  scrape_interval: 15s
  evaluation_interval: 15s # The default is every 1 minute.

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090' ]
  - job_name: 'node-exporter'
    static_configs:
    - targets: ['172.17.0.1:9100']
  - job_name: 'sensors'
    static_configs:
    - targets:
      - 'defuser:8080'
