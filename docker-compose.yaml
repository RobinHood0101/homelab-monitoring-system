services:
  sensor-api:
    build:
      context: ./services/sensor-api
    container_name: sensor-api
    ports:
      - '8000:8000'
    environment:
      SENSOR_API_PORT: '8000'
    networks:
      - monitoring
    restart: unless-stopped

  dashboard:
    build:
      context: ./services/dashboard
    container_name: dashboard
    ports:
      - '8081:8080'
    environment:
      SENSOR_API_URL: 'http://sensor-api:8000'
      DASHBOARD_HOST: '0.0.0.0'
      DASHBOARD_PORT: '8080'
    depends_on:
      - sensor-api
    networks:
      - monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./services/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
    ports:
      - '9090:9090'
    depends_on:
      - sensor-api
      - node-exporter
    networks:
      - monitoring
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    ports:
      - '9100:9100'
    networks:
      - monitoring
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    volumes:
      - ./services/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    command:
      - -config.file=/etc/loki/loki.yaml
    ports:
      - '3100:3100'
    networks:
      - monitoring
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    volumes:
      - ./services/promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - -config.file=/etc/promtail/promtail.yaml
    depends_on:
      - loki
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD missing in .env}
    volumes:
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring
    restart: unless-stopped

volumes:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
