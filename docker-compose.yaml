services:
  prometheus:
    image: prom/prometheus
    volumes:
      - ./services/prometheus/:/etc/prometheus/
      - prometheus_data:/prometheus
    command: [
      '--config.file=/etc/prometheus/prometheus.yaml',
      '--storage.tsdb.path=/prometheus',
      '--storage.tsdb.retention.time=1y',
    ]
    ports:
      - '9090:9090'
    restart: always

  node-exporter:
    image: prom/node-exporter
    volumes:
      - /:/host:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.wifi'
    network_mode: host
    restart: always

  loki:
    image: grafana/loki
    volumes:
      - ./services/loki/loki.yaml:/etc/loki/loki.yaml
      - loki_data:/loki
    command:
      - --config.file=/etc/loki/loki.yaml
    ports:
      - 3100:3100
    restart: always

  promtail:
    image: grafana/promtail
    volumes:
        - /var/lib/docker/containers:/var/lib/docker/containers:ro
        - /var/run/docker.sock:/var/run/docker.sock
        - ./services/promtail/promtail.yaml:/etc/promtail/promtail.yaml
        - promtail_data:/data
    command: -config.file=/etc/promtail/promtail.yaml
    depends_on:
        - loki
    ports:
        - 1514:1514/udp
    restart: always

  grafana:
    image: grafana/grafana
    environment:
      - 'GF_SECURITY_ADMIN_PASSWORD=admin'
    volumes:
      - ./services/grafana:/etc/grafana
      - grafana_data:/var/lib/grafana
    ports:
      - 3000:3000
    restart: always

volumes:
  prometheus_data:
  loki_data:
  promtail_data:
  grafana_data:
